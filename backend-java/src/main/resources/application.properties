server.port=8080
spring.application.name=biz-ai-backend

# --- Python analytics service ---
analytics.base-url=http://localhost:8000
analytics.timeout-seconds=15
# /ai/ask is slower: Gemini retries + several function-calling rounds
analytics.ask-timeout-seconds=60

# --- Database: PostgreSQL. Override with DB_URL / DB_USER / DB_PASSWORD.
# No Postgres installed? Run with the "h2" profile (in-memory, see application-h2.properties).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bizai}
spring.datasource.username=${DB_USER:bizai}
spring.datasource.password=${DB_PASSWORD:bizai}
# Creates/updates the table from the Sale class. Fine for a project this size;
# a real deployment would use migrations (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- CSV uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- CORS: comma-separated origins allowed to call /api from a browser ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Insert 5 demo rows if the table is empty
app.seed-demo-data=true
