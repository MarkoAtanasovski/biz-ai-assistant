server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router / client-side routing safety net: if a path doesn't
    # match a real file, serve index.html and let React handle it.
    # (Not strictly needed for this one-page app, but standard practice.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
