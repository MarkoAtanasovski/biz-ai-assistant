server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default upload limit is 1 MB; the backend allows 5 MB CSVs.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend-java:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/ai/ask can take a while (Gemini retries + several rounds);
        # the backend gives up after 60s, so wait slightly longer than that.
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
