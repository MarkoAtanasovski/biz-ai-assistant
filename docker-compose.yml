services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizai
      POSTGRES_USER: ${POSTGRES_USER:-bizai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizai}
    volumes:
      # Named volume: your data survives "docker compose down".
      # "docker compose down -v" deletes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizai} -d bizai"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" on purpose - only the backend container needs the database.

  analytics-python:
    build: ./analytics-python
    ports:
      - "8000:8000"
    environment:
      # ${VAR} pulls from your .env file (or your shell) at "docker
      # compose up" time - the key is never written into this file
      # or baked into the image.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend-java:
    build: ./backend-java
    ports:
      - "8080:8080"
    environment:
      # Inside Docker's network, containers reach each other by service
      # name, not localhost.
      ANALYTICS_BASE_URL: http://analytics-python:8000
      DB_URL: jdbc:postgresql://postgres:5432/bizai
      DB_USER: ${POSTGRES_USER:-bizai}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bizai}
    depends_on:
      postgres:
        condition: service_healthy
      analytics-python:
        condition: service_healthy

  frontend-react:
    build: ./frontend-react
    ports:
      - "5173:80"
      # host:container - nginx listens on 80 inside the container, but we
      # map it to 5173 so the URL matches local dev and Java's CORS default.
    depends_on:
      - backend-java

volumes:
  pgdata:
